<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DEMULL STORE</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--blue:#007AFF;--blue-soft:#e8f2ff;--blue-line:#d6e6ff;--text:#1c1c1e;--muted:#8e8e93;--line:#e5e5ea;--red:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid rgba(0,122,255,.45);outline-offset:2px}
.wrap{width:min(1100px,92%);margin:0 auto}

/* Bilah atas */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid rgba(60,60,67,.12);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--blue-soft);font-size:21px;display:grid;place-items:center;transition:transform .15s,background .15s}
.gear:hover{background:#d6e8ff}
.gear:active{transform:scale(.9)}

/* Hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center;padding:36px 0 24px}
.hero h1{margin:0 0 12px;font-size:clamp(32px,6vw,54px);line-height:1.06;letter-spacing:-.025em;font-weight:850}
.hero p{margin:0;max-width:540px;color:#6c6c70;font-size:16px;line-height:1.7;white-space:pre-wrap}
.hero-art{min-height:200px;display:grid;place-items:center;border-radius:30px;border:1px solid var(--blue-line);background:linear-gradient(150deg,#fff 0%,#dcebff 100%);box-shadow:0 16px 44px rgba(0,122,255,.14)}
.orb{width:128px;height:128px;border-radius:34px;display:grid;place-items:center;font-size:64px;background:linear-gradient(145deg,#5ac8fa,#007AFF);box-shadow:0 16px 38px rgba(0,122,255,.36);transform:rotate(-8deg)}

/* Daftar kolom */
.section{padding:12px 0 64px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-head h2{margin:0;font-size:24px;letter-spacing:-.015em}
.sub{margin-top:4px;color:var(--muted);font-size:14px}
.count{flex:none;padding:6px 12px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.col{position:relative;display:block;width:100%;aspect-ratio:2.1/1;padding:0;border:0;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#5ac8fa,#007AFF);text-align:left;box-shadow:0 2px 12px rgba(0,0,0,.07);transition:transform .18s,box-shadow .18s}
.col:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,122,255,.2)}
.col:active{transform:scale(.985)}
.col img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.col .ph{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:34px;font-size:58px;opacity:.9}
.col .bar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:15px;background:rgba(255,255,255,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.col .bar b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col .bar i{font-style:normal;font-size:15px;color:var(--blue);font-weight:900}
.empty{padding:36px 18px;border:1.5px dashed #c7d7ee;border-radius:20px;background:#fff;color:var(--muted);text-align:center}

/* Lembar detail & PIN */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.overlay.center{align-items:center}
.sheet{width:min(640px,100%);max-height:90dvh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:#fff;animation:up .34s cubic-bezier(.2,.9,.3,1)}
@media(min-width:720px){.overlay{align-items:center}.sheet{border-radius:26px}}
.grab{width:38px;height:5px;margin:2px auto 12px;border-radius:9px;background:#d1d1d6}
.s-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.s-top h3{flex:1;margin:0;font-size:22px;letter-spacing:-.01em;overflow-wrap:anywhere}
.x{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:#f2f2f7;color:#6c6c70;font-size:15px;font-weight:800}
.banner{display:block;width:100%;aspect-ratio:2.1/1;margin-bottom:14px;border-radius:16px;object-fit:cover;background:var(--blue-soft)}
.textlist{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.txt{padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .38s both}
.txt:last-child{border-bottom:0}
.none{padding:22px 16px;color:var(--muted);text-align:center}

.pinbox{max-height:96dvh;overflow:auto;width:min(330px,88%);padding:26px 20px 16px;border-radius:30px;background:#fff;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .28s cubic-bezier(.2,.9,.3,1)}
.pinbox h3{margin:6px 0 4px;font-size:19px}
.pinbox p{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.lock{font-size:30px}
.dots{display:flex;justify-content:center;gap:14px;margin:20px 0 22px;min-height:16px}
.dots span{width:15px;height:15px;border-radius:50%;border:2px solid var(--blue);transition:background .12s,transform .12s}
.dots span.on{background:var(--blue);transform:scale(1.08)}
.dots.shake{animation:shake .38s}
.pad{display:grid;grid-template-columns:repeat(3,72px);justify-content:center;gap:12px}
.pad button{height:72px;border:0;border-radius:50%;background:#f2f2f7;font-size:27px;font-weight:500;transition:background .1s,transform .1s}
.pad button:active{background:#cfe3ff;transform:scale(.94)}
.pad .blank{visibility:hidden}
.pad .del{background:none;font-size:22px;color:#6c6c70}
.linkbtn{margin-top:14px;padding:8px 14px;border:0;background:none;color:var(--blue);font-size:16px}

/* Pengaturan */
.settings{position:fixed;inset:0;z-index:90;overflow:auto;background:var(--bg);animation:fade .2s}
.s-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(242,242,247,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(60,60,67,.12)}
.s-bar h2{margin:0;font-size:17px}
.tbtn{min-width:64px;padding:9px 6px;border:0;background:none;color:var(--blue);font-size:17px}
.tbtn.b{font-weight:800;text-align:right}
.s-body{width:min(720px,100%);margin:0 auto;padding:4px 16px 90px}
.gh{margin:24px 0 8px 6px;font-size:14px;font-weight:700;color:var(--muted)}
.group{padding:4px 16px;border-radius:16px;background:#fff}
.fld{display:block;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.fld:last-child{border-bottom:0}
.fld input,.fld textarea,.ti textarea,.bulk textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:0;border-radius:10px;background:#f2f2f7;color:var(--text);font:inherit;font-size:16px;font-weight:400;resize:vertical}
.fld input:focus,.fld textarea:focus,.ti textarea:focus,.bulk textarea:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.hint{display:block;margin-top:6px;font-size:12px;font-weight:400;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-size:16px}
.stepper div{display:flex;align-items:center;gap:14px}
.stepper b{min-width:26px;text-align:center;font-size:18px}
.stepper button{width:36px;height:36px;border:0;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:22px;font-weight:800;line-height:1}
.coled{margin-top:10px;border-radius:16px;background:#fff;overflow:hidden}
.coled summary{display:flex;align-items:center;gap:10px;padding:13px 16px;list-style:none;cursor:pointer}
.coled summary::-webkit-details-marker{display:none}
.coled .num{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:13px;font-weight:800}
.coled .ttl{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coled .chev{color:var(--muted);transition:transform .2s}
.coled[open] .chev{transform:rotate(90deg)}
.cbody{padding:4px 16px 16px;border-top:1px solid var(--line)}
.imgprev{display:grid;place-items:center;width:100%;aspect-ratio:2.1/1;margin-top:12px;border-radius:14px;overflow:hidden;background:var(--blue-soft);color:var(--muted);font-size:14px}
.imgprev img{width:100%;height:100%;object-fit:cover}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{padding:10px 14px;border:0;border-radius:11px;background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:800}
.btn.fill{background:var(--blue);color:#fff}
.btn.red{background:#ffe9e7;color:var(--red)}
.btn:disabled,.mini:disabled{opacity:.4;cursor:default}
.sublabel{margin:16px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.ti{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;margin-top:8px}
.ti textarea{margin-top:0}
.mini-col{display:flex;flex-direction:column;gap:5px}
.mini{width:34px;height:30px;border:0;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-weight:800}
.mini.red{background:#ffe9e7;color:var(--red)}
.bulk{margin-top:10px}
.bulk textarea{margin-top:0}


/* Teks samping, clue, key */
.tag{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:800;line-height:1.5;vertical-align:middle;white-space:nowrap}
.clue{margin:12px 0 0;padding:10px 12px;border-radius:14px;background:var(--blue-soft);color:#1b4f9c;font-size:14px;line-height:1.5;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.pad .gate{background:var(--blue-soft);font-size:26px}
.keyinfo{margin-top:12px;font-size:13px;color:var(--muted)}
@media(max-height:720px){.pad{grid-template-columns:repeat(3,64px);gap:10px}.pad button{height:64px;font-size:24px}.dots{margin:14px 0 16px}}
.keyfab{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;width:58px;height:58px;border:0;border-radius:50%;background:linear-gradient(145deg,#5ac8fa,#007AFF);font-size:27px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,122,255,.38);transition:transform .15s}
.keyfab:active{transform:scale(.9)}
.kbadge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.kbadge:empty{display:none}
.kbal{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:4px;border-radius:16px;background:var(--blue-soft);color:var(--blue);font-weight:800}
.kitem{margin-top:10px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.khead{display:flex;align-items:center;gap:10px;width:100%;padding:15px 16px;border:0;background:none;text-align:left;font-size:17px;font-weight:700}
.khead>span:first-child{font-size:22px}
.khead b{flex:1}
.khead .chev{color:var(--muted);transition:transform .2s}
.kitem.open .chev{transform:rotate(90deg)}
.kbody{display:none;padding:2px 14px 16px}
.kitem.open .kbody{display:block}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kbox{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;padding:6px 4px;border:1px solid var(--blue-line);border-radius:18px;background:linear-gradient(160deg,#fff,#e8f2ff);text-align:center;transition:transform .12s}
.kbox:active{transform:scale(.95)}
.kbox .lg{display:grid;place-items:center;height:32px;font-size:30px;line-height:1}
.kbox .lg img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.kbox .nm,.kbox .pr{max-width:100%;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbox .nm{font-weight:700}
.kbox .pr{font-weight:900;color:var(--blue)}
.redeem{display:flex;gap:8px}
.redeem input{flex:1;min-width:0;padding:12px;border:0;border-radius:12px;background:#f2f2f7;color:var(--text);font:inherit;font-size:16px;text-transform:uppercase}
.redeem input:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.kmsg{min-height:18px;margin-top:8px;font-size:13px;color:var(--muted)}
.kmsg.err{color:var(--red)}
.kmsg.ok{color:#1c8c3a}
.ios-ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,.4);animation:fade .18s}
.ios-box{width:min(270px,80%);overflow:hidden;border-radius:14px;background:rgba(255,255,255,.97);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#000;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .22s cubic-bezier(.2,.9,.3,1)}
.ios-body{padding:20px 16px 18px}
.ios-body h4{margin:0 0 4px;font-size:17px;font-weight:600;color:#000}
.ios-body p{margin:0;font-size:13px;line-height:1.4;color:#000}
.ios-btns{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid rgba(60,60,67,.29)}
.ios-btns button{height:44px;border:0;background:none;color:var(--blue);font-size:17px}
.ios-btns button+button{border-left:.5px solid rgba(60,60,67,.29);font-weight:600}
.ios-btns button:active{background:rgba(0,0,0,.06)}
.lksel{display:block;width:100%;margin-top:8px;padding:9px 12px;border:0;border-radius:10px;background:#f2f2f7;color:var(--text);font:inherit;font-size:15px}
.kcrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;font-weight:600;color:var(--text)}
.kcrow .kc{width:96px;padding:8px 10px;border:0;border-radius:10px;background:#f2f2f7;color:var(--text);font:inherit;font-size:16px}
.kcrow .kc:focus,.lksel:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.ios-input{display:block;width:100%;margin:12px 0 0;padding:9px 10px;border:.5px solid rgba(60,60,67,.29);border-radius:8px;background:#fff;color:#000;font:inherit;font-size:16px;text-align:center}
.ios-input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,122,255,.25)}
.ios-err{min-height:16px;margin-top:6px;font-size:12px;color:var(--red)}
@keyframes iosShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ios-box.shake{animation:iosShake .35s}
.kcrow .kcode{width:160px}
.txt.na{animation:none}
.txt.lk{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
.txt.lk:active{background:#f2f2f7}
.txt.lk:focus-visible{outline:3px solid rgba(0,122,255,.45);outline-offset:-3px}
.txt.lk .mask{letter-spacing:.04em}
.txt.lk .tag{margin-left:0}
.txt.lk .cost{flex:none;margin-left:auto;padding:3px 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:800}
.unall{width:100%;margin-bottom:12px;padding:13px 14px;font-size:15px}
.lkopt{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:600;color:var(--text)}
.lkopt input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--blue)}
.ti-f{min-width:0}
.ti .tg{display:block;width:100%;margin-top:6px;padding:9px 12px;border:0;border-radius:10px;background:#f2f2f7;color:var(--blue);font:inherit;font-size:15px;font-weight:600}
.ti .tg:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.pkprev{display:grid;place-items:center;width:64px;height:64px;margin-top:10px;border-radius:14px;overflow:hidden;background:var(--blue-soft);font-size:32px}
.pkprev img{width:100%;height:100%;object-fit:contain}

.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:300;transform:translateX(-50%);padding:11px 18px;border-radius:99px;background:rgba(28,28,30,.92);color:#fff;font-size:14px;animation:rise .3s both}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(max-width:720px){
 .hero{grid-template-columns:1fr;gap:18px;padding-top:26px}
 .hero-art{min-height:130px;border-radius:24px}
 .orb{width:92px;height:92px;border-radius:26px;font-size:46px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

 }

/* ---------- Papan PIN ---------- */
function askPin(title,sub,expected,opts){
 opts=opts||{};
 return new Promise(function(resolve){
  var len=expected.length, val='';
  var ov=document.createElement('div'); ov.className='overlay center';
  var keys=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(k){
   if(k==='')return opts.key?'<button type="button" class="gate" data-gate aria-label="Buka dengan key" title="Buka dengan key">🔐</button>':'<button class="blank" tabindex="-1" aria-hidden="true"></button>';
   return '<button type="button" data-k="'+k+'"'+(k==='⌫'?' class="del" aria-label="Hapus"':'')+'>'+k+'</button>';
  }).join('');
  ov.innerHTML='<div class="pinbox" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="lock">🔒</div><h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p>'+
   (opts.clue?'<div class="clue">💡 '+esc(opts.clue)+'</div>':'')+
   '<div class="dots" id="pinDots">'+new Array(len+1).join('<span></span>')+'</div><div class="pad">'+keys+'</div>'+
   (opts.key?'<div class="keyinfo">🔐 Buka tanpa PIN memakai '+(opts.cost||1)+' key · Key kamu: '+wallet.n+'</div>':'')+
   '<button class="linkbtn" type="button" data-cancel>Batal</button></div>';
  var dots=ov.querySelector('#pinDots');
  function paint(){[].forEach.call(dots.children,function(d,i){d.classList.toggle('on',i<val.length)})}
  function done(ok){document.removeEventListener('keydown',onKey,true);ov.remove();lockScroll(false);resolve(ok)}
  function press(k){
   if(k==='⌫'){val=val.slice(0,-1);paint();return}
   if(val.length>=len)return;
   val+=k;paint();
   if(val.length===len){
    if(val===expected){setTimeout(function(){done(true)},120)}
    else{dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');setTimeout(function(){val='';paint()},380)}
   }
  }
  function onKey(e){
   if(document.querySelector('.ios-ov'))return;
   if(/^\d$/.test(e.key)){press(e.key);e.preventDefault();e.stopPropagation()}
   else if(e.key==='Backspace'){press('⌫');e.preventDefault();e.stopPropagation()}
   else if(e.key==='Escape'){done(false);e.stopPropagation()}
  }
  ov.addEventListener('click',function(e){
   if(e.target.closest('[data-gate]')){
    var cost=opts.cost||1;
    if(!needKeys(cost))return;
    iosConfirm('Buka kolom ini?','Pakai '+cost+' key untuk membuka semua teks di kolom ini.','Buka').then(function(ok){
     if(!ok)return;
     if(!spendKey(cost)){toast('Key gagal dipakai. Coba lagi.');return}
     var left=wallet.n; done(true); toast(cost+' key terpakai. Sisa key: '+left);
    });
    return;
   }
   var b=e.target.closest('button[data-k]');
   if(b){press(b.getAttribute('data-k'));return}
   if(e.target===ov||e.target.closest('[data-cancel]'))done(false);
  });
  document.addEventListener('keydown',onKey,true);
  document.body.appendChild(ov); lockScroll(true);
 });
}

/* ---------- Dialog input kode gaya iOS ---------- */
function normCode(v){return String(v==null?'':v).trim().toLowerCase()}
function iosPrompt(title,msg,validate){
 return new Promise(function(resolve){
  var ov=document.createElement('div'); ov.className='ios-ov';
  ov.innerHTML='<div class="ios-box" role="alertdialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="ios-body"><h4>'+esc(title)+'</h4><p>'+esc(msg)+'</p>'+

   '<div class="ios-btns"><button type="button" data-no>Batal</button><button type="button" data-yes>Buka</button></div></div>';
  var box=ov.querySelector('.ios-box'), inp=ov.querySelector('.ios-input'), err=ov.querySelector('.ios-err');
  function done(v){document.removeEventListener('keydown',onKey,true);ov.remove();lockScroll(false);resolve(v)}
  function submit(){
   if(validate(inp.value)){done(true);return}
   err.textContent='Kode salah. Coba lagi.'; inp.select();
   box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  }
  function onKey(e){
   if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(false)}
   else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();submit()}
  }
  ov.addEventListener('click',function(e){
   var b=e.target.closest('button');
   if(b){if(b.hasAttribute('data-yes'))submit();else done(false)}
   else if(e.target===ov)done(false);
  });
  document.addEventListener('keydown',onKey,true);
  document.body.appendChild(ov); lockScroll(true); inp.focus();
 });
}

function iosConfirm(title,msg,okLabel){

 });

 });

   '<div class="cbody">'+

 panel.innerHTML=

  '</div>'+

   packs+

function onInput(e){
 var t=e.target, f=t.getAttribute('data-f'), ci=t.getAttribute('data-ci');
 if(f){draft[f]=t.value;return}
 var kf=t.getAttribute('data-kf'); if(kf){draft.keyShop[kf]=t.value;return}
 var pk=t.getAttribute('data-pk');
 if(pk!==null){
  var pf=t.getAttribute('data-pf'), pp=draft.keyShop.packs[+pk]; if(!pp||!pf)return;
  pp[pf]=t.value;
  if(pf==='logo'){var pv=document.getElementById('pkprev'+pk);if(pv)pv.innerHTML=isImg(t.value)?'<img src="'+esc(t.value)+'" alt="">':esc(t.value||'🔑')}
  return;
 }
 if(ci===null)return;
 var c=draft.columns[+ci]; if(!c)return;
 var ck=t.getAttribute('data-ck'), ti=t.getAttribute('data-ti');
 if(ti!==null){
  var it=c.texts[+ti]; if(!it)return;
  if(t.getAttribute('data-cd')!==null){it.code=t.value; return}
  if(t.getAttribute('data-lm')!==null){var m=t.value; it.lock=m==='1'; it.vip=m==='2'; it.vault=m==='3'; if(it.vip&&!(it.keys>0))it.keys=2; renderSettings(); return}
  if(t.getAttribute('data-kc')!==null){var kn=parseInt(t.value,10); it.keys=kn>0?Math.min(kn,999):1; return}
  if(t.getAttribute('data-tg'))it.tag=t.value; else it.t=t.value;
  return;
 }
 if(ck==='title'){c.title=t.value;var s=t.closest('details').querySelector('.ttl');if(s)s.textContent=t.value||'Tanpa judul'}
 else if(ck==='clue'){c.clue=t.value}
 else if(ck==='pin'){var p=t.value.replace(/\D/g,'').slice(0,8);if(p!==t.value)t.value=p;c.pin=p}
 else if(ck==='imageurl'){c.image=t.value.trim();var pv=t.closest('.cbody').querySelector('.imgprev');pv.innerHTML=c.image?'<img src="'+esc(c.image)+'" alt="">':'Belum ada gambar'}
}
function dirty(){return JSON.stringify(draft)!==JSON.stringify(state)}
function swap(a,i,j){var x=a[i];a[i]=a[j];a[j]=x}

function onClick(e){
 var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
 var a=b.getAttribute('data-act'), ci=+b.getAttribute('data-ci'), ti=+b.getAttribute('data-ti');
 var c=draft.columns[ci];
 switch(a){
  case 'cancel': if(!dirty()||confirm('Buang perubahan yang belum disimpan?'))closeSettings(); return;
  case 'save':
   state=normalize(draft); state.updatedAt=Date.now(); local=state;
   if(!persist()){alert('Gagal menyimpan. Penyimpanan browser penuh. Gunakan gambar lebih kecil atau tempel URL gambar.');return}
   unlocked={}; closeSettings(); render(); toast('Perubahan tersimpan'); return;
  case 'colplus': if(draft.columns.length>=60){alert('Maksimal 60 kolom.');return}
   var nc={id:uid(),title:'Kolom '+(draft.columns.length+1),image:'',pin:'',clue:'',texts:[]}; draft.columns.push(nc); openCols[nc.id]=true; break;
  case 'colminus': var last=draft.columns[draft.columns.length-1]; if(!last)return;
   if((last.title||last.texts.length||last.image)&&!confirm('Hapus kolom terakhir beserta isinya?'))return; draft.columns.pop(); break;
  case 'colup': swap(draft.columns,ci,ci-1); break;
  case 'coldown': swap(draft.columns,ci,ci+1); break;
  case 'coldel': if(!confirm('Hapus kolom ini beserta isinya?'))return; draft.columns.splice(ci,1); break;
  case 'imgpick': pendingImg=ci; pendingPack=-1; fileImg.value=''; fileImg.click(); return;
  case 'pkimg': pendingPack=+b.getAttribute('data-pk'); pendingImg=-1; fileImg.value=''; fileImg.click(); return;
  case 'pkimgdel': var pq=draft.keyShop.packs[+b.getAttribute('data-pk')]; if(pq)pq.logo=''; break;
  case 'keyreset':
   if(!confirm('Hapus semua key dan riwayat redeem di perangkat ini?'))return;
   wallet={n:0,used:[]}; writeKeys(wallet); paintKeys(); toast('Key di perangkat ini direset'); return;
  case 'imgdel': c.image=''; break;
  case 'txtadd': c.texts.push({t:'',tag:'',lock:false,vip:false,keys:2,vault:false,code:''}); break;
  case 'txtup': swap(c.texts,ti,ti-1); break;
  case 'txtdown': swap(c.texts,ti,ti+1); break;
  case 'txtdel': c.texts.splice(ti,1); break;
  case 'bulkopen': bulkOpen[c.id]=true; break;
  case 'bulkcancel': delete bulkOpen[c.id]; break;
  case 'bulkadd':
   var ta=document.getElementById('bulk'+ci);
   (ta?ta.value:'').split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean).forEach(function(s){c.texts.push({t:s,tag:'',lock:false,vip:false,keys:2,vault:false,code:''})});
   delete bulkOpen[c.id]; break;
  case 'setpin':
   var np=document.getElementById('newPin').value.trim();
   if(!/^\d{4,8}$/.test(np)){alert('PIN harus berupa angka 4 sampai 8 digit.');return}
   try{localStorage.setItem(PIN_KEY,np)}catch(err){alert('Gagal menyimpan PIN.');return}
   document.getElementById('newPin').value=''; toast('PIN pengaturan diubah'); return;
  case 'export':
   var out=clone(draft); out.updatedAt=Date.now();
   var blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
   var u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='config.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){URL.revokeObjectURL(u)},4000); return;
  case 'import': fileImp.value=''; fileImp.click(); return;
  case 'reset': if(!confirm('Kembalikan semua pengaturan ke bawaan? Perubahan baru tersimpan setelah menekan Simpan.'))return; draft=normalize(defaults()); openCols={}; bulkOpen={}; break;
  default: return;
 }
 renderSettings();
}

/* Gambar: dikecilkan dulu agar muat di penyimpanan browser */
fileImg.addEventListener('change',function(){
 var f=fileImg.files&&fileImg.files[0]; if(!f||(pendingImg<0&&pendingPack<0)||!draft)return;
 var idx=pendingImg, pk=pendingPack, rd=new FileReader();
 rd.onload=function(){
  var im=new Image();
  im.onload=function(){
   var isPack=pk>=0, max=isPack?256:1000, r=Math.min(1,max/Math.max(im.width,im.height));
   var cv=document.createElement('canvas'); cv.width=Math.round(im.width*r); cv.height=Math.round(im.height*r);
   var cx=cv.getContext('2d');
   if(!isPack){cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height)}
   cx.drawImage(im,0,0,cv.width,cv.height);
   if(isPack){if(draft&&draft.keyShop.packs[pk]){draft.keyShop.packs[pk].logo=cv.toDataURL('image/png');renderSettings()}}
   else if(draft&&draft.columns[idx]){draft.columns[idx].image=cv.toDataURL('image/jpeg',.82);renderSettings()}
  };
  im.onerror=function(){alert('File gambar tidak bisa dibaca.')};
  im.src=rd.result;
 };
 rd.readAsDataURL(f);
});
fileImp.addEventListener('change',function(){
 var f=fileImp.files&&fileImp.files[0]; if(!f||!draft)return;
 var rd=new FileReader();
 rd.onload=function(){
  try{var j=JSON.parse(rd.result); if(!j||!Array.isArray(j.columns))throw 0; draft=normalize(j); openCols={}; bulkOpen={}; renderSettings(); toast('Data diimpor. Tekan Simpan untuk menerapkan.')}
  catch(err){alert('File tidak valid. Gunakan file config.json hasil ekspor.')}
 };
 rd.readAsText(f);
});

/* ---------- Mulai ---------- */
render(); paintKeys();
/* Jika ada config.json di folder yang sama dan lebih baru dari data lokal, pakai itu */
try{
 fetch('config.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(j&&Array.isArray(j.columns)&&(!local||(Number(j.updatedAt)||0)>(Number(state.updatedAt)||0))){state=normalize(j);render()}
 }).catch(function(){});
}catch(e){}
})();
